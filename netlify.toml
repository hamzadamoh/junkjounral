[build]
  command = "npm run build"
  publish = "dist"

# Redirect API routes to Netlify Functions
[[redirects]]
  from = "/api/pollinations/generate"
  to = "/.netlify/functions/pollinations-generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/google-drive"
  to = "/.netlify/functions/google-drive"
  status = 200
  force = true

[[redirects]]
  from = "/api/etsy"
  to = "/.netlify/functions/etsy"
  status = 200
  force = true

[[redirects]]
  from = "/api/openai/chat"
  to = "/.netlify/functions/openai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/wordpress/upload"
  to = "/.netlify/functions/wordpress-upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/dropbox/upload-grid"
  to = "/.netlify/functions/dropbox-upload-grid"
  status = 200
  force = true

[[redirects]]
  from = "/api/ttapi"
  to = "/.netlify/functions/ttapi"
  status = 200
  force = true

# Catch-all for SPA routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[build.environment]
  NODE_VERSION = "18"

# Netlify Functions configuration
[functions]
  # Functions directory
  directory = "netlify/functions"
  # Node.js version for functions
  node_bundler = "esbuild"
